version: '3.9'

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    network_mode: host
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    network_mode: host
    env_file:
      - ../.env
    depends_on:
      - server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
